<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إيجاري — العقارات المتاحة للإيجار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:0 16px}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800}
.logo-name{font-size:20px;font-weight:800;color:#fff}
.header-links{display:flex;align-items:center;gap:12px}
.btn-login{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;font-family:'Cairo',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-login:hover{background:rgba(255,255,255,.25)}

/* HERO */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:0 16px 14px;text-align:center;color:#fff}
.hero h1{font-size:32px;font-weight:800;margin-bottom:10px}
.hero p{font-size:16px;opacity:.85;margin-bottom:32px}
.search-bar-wrap{max-width:600px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;font-size:14px;color:#fff;font-family:'Cairo',sans-serif;outline:none}
.search-input::placeholder{color:rgba(255,255,255,.6)}
.search-input:focus{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}

/* FILTERS */
.chips{background:#fff;border-bottom:1px solid #e2e8f0;padding:8px 12px;position:sticky;top:0;z-index:40;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;direction:rtl}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#f0f2f5;border:1.5px solid transparent;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;color:#1a202c;cursor:pointer}
.chip.on{background:#eef2ff;border-color:#4f46e5;color:#4f46e5}
.chip-clear{background:#fee2e2;color:#b91c1c}
.rline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:#f7f9fb}
.sheet{position:fixed;inset:0;z-index:9000;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-card{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px}
.sheet-h button{border:0;background:#f0f2f5;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.sec{display:none}.sec.on{display:block}
.sec label{display:block;font-size:12px;color:#718096;font-weight:700;margin:6px 0 4px}
.sec select{width:100%;padding:12px;font-size:14px;margin-bottom:6px}
.sheet-f{display:flex;gap:10px;margin-top:14px}
.sheet-f button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer}
.b-apply{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.b-clear{background:#f0f2f5;color:#1a202c;flex:0 0 35%!important}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter-lbl{font-size:12px;font-weight:700;color:#4a5568}
.fsel{background:#f7f9fb;border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 12px;font-size:13px;font-family:'Cairo',sans-serif;color:#1a202c;outline:none;cursor:pointer}
.fsel:focus{border-color:#4f46e5}
.results-count{margin-right:auto;font-size:13px;color:#718096;font-weight:600}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:24px}

/* CARDS GRID */
.listings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.listing-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .2s;border:1px solid #e2e8f0}
.listing-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.12);transform:translateY(-3px)}
.card-img{height:180px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:64px;position:relative}
.card-badge{z-index:2;position:absolute;top:12px;right:12px;background:#fff;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#4f46e5}
.card-body{padding:16px}
.card-footer{display:flex;gap:8px}
.btn-request{flex:1}
.btn-share{flex:0 0 auto;border:1.5px solid #4f46e5;color:#4f46e5;background:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;font-size:13px}
.hl{outline:3px solid #4f46e5;outline-offset:2px}
.card-title{font-size:16px;font-weight:800;color:#1a202c;margin-bottom:4px}
.card-addr{font-size:12px;color:#a0aec0;margin-bottom:12px;display:flex;align-items:center;gap:4px}
.card-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card-detail{background:#f7f9fb;border-radius:8px;padding:8px 10px}
.cd-lbl{font-size:10px;color:#a0aec0;font-weight:600;margin-bottom:2px}
.cd-val{font-size:13px;font-weight:700;color:#1a202c}
.card-price{font-size:20px;font-weight:800;color:#4f46e5;margin-bottom:14px}
.card-price span{font-size:13px;color:#a0aec0;font-weight:400}
.card-footer{display:flex;gap:8px}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:#25d366;color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;text-decoration:none}
.btn-wa:hover{background:#128c7e}
.btn-request{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer}
.btn-request:hover{opacity:.9}

/* EMPTY */
.empty{text-align:center;padding:80px 24px;color:#a0aec0}
.empty-icon{font-size:64px;margin-bottom:16px}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;color:#4a5568}
.empty-sub{font-size:14px}

/* LOADING */
.ld{display:flex;align-items:center;justify-content:center;padding:80px;color:#a0aec0;font-size:14px;gap:10px}
.sp{width:20px;height:20px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-ttl{font-size:20px;font-weight:800;margin-bottom:6px;color:#1a202c}
.modal-sub{font-size:13px;color:#718096;margin-bottom:20px}
.modal-prop{background:#f7f9fb;border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.modal-prop-icon{font-size:24px}
.modal-prop-name{font-size:14px;font-weight:700;color:#1a202c}
.modal-prop-addr{font-size:12px;color:#a0aec0}
.fgi{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label{font-size:12px;color:#4a5568;font-weight:700}
input,textarea{background:#f7f9fb;border:1.5px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:13px;color:#1a202c;font-family:'Cairo',sans-serif;outline:none;width:100%}
input:focus,textarea:focus{border-color:#4f46e5;background:#fff}
input::placeholder,textarea::placeholder{color:#a0aec0}
textarea{resize:vertical;min-height:80px}
.fa{display:flex;gap:10px;margin-top:18px}
.btn-submit{flex:1;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer}
.btn-cancel{background:#f7f9fb;color:#718096;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;font-family:'Cairo',sans-serif;cursor:pointer}
.success-box{text-align:center;padding:20px 0}
.success-icon{font-size:56px;margin-bottom:12px}
.success-title{font-size:18px;font-weight:800;color:#16a34a;margin-bottom:6px}
.success-sub{font-size:13px;color:#718096;margin-bottom:20px;line-height:1.7}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 18px;font-size:13px;font-weight:600;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.toast.show{display:flex;align-items:center;gap:8px;animation:su .2s ease}
@keyframes su{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* FOOTER */
.footer{background:#1a202c;color:#a0aec0;padding:32px 24px;margin-top:48px;text-align:center}
.footer-logo{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px}
.footer-sub{font-size:13px;margin-bottom:16px}
.footer-link{color:#4f46e5;text-decoration:none;font-weight:600}

/* RESPONSIVE */
@media(max-width:640px){
  .listings-grid{grid-template-columns:1fr}
  .filters-inner{gap:8px}
  .search-input{width:100%;padding:10px 14px}
}

.mk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 12px}
@media(min-width:700px){.mk-grid{grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 0}}
@media(min-width:1000px){.mk-grid{grid-template-columns:repeat(4,1fr)}}
.mk-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(15,23,42,.1);cursor:pointer;transition:transform .15s}
.mk-card:active{transform:scale(.98)}
.mk-img{position:relative;aspect-ratio:1/1;background:#eef0f6}
.mk-img>img{width:100%;height:100%;object-fit:cover;display:block}
.mk-ph{width:100%;height:100%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.mk-ph img{position:absolute;width:55%;opacity:.18;border-radius:22%}
.mk-ph span{font-size:44px;position:relative}
.mk-badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.95);color:#4f46e5;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700}
.mk-count{position:absolute;bottom:8px;left:8px;background:rgba(15,23,42,.65);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px}
.mk-body{padding:8px 10px 11px}
.mk-price{font-weight:800;font-size:16px;color:#4f46e5}
.mk-price small{font-size:11px;color:#718096;font-weight:600;margin-right:4px}
.mk-title{font-size:13px;font-weight:700;color:#1a202c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mk-loc{font-size:12px;color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.det{position:fixed;inset:0;z-index:8000;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center}
.det.open{display:flex}
.det-card{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;position:relative}
.det-x{position:absolute;top:12px;left:12px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:rgba(15,23,42,.6);color:#fff;font-size:16px;cursor:pointer}
.det-gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1/1;max-height:62vh;background:#eef0f6}
.det-gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.det-title{font-size:18px;font-weight:800;color:#1a202c;margin-top:4px}
.det-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.det-chip{background:#eef2ff;color:#4f46e5;border-radius:14px;padding:4px 11px;font-size:12px;font-weight:700}
.det-notes{font-size:13px;color:#4a5568;line-height:1.8;margin-top:6px}

button,.chip,.mk-card,.btn-request,.btn-share,.btn-login,.sheet-card button,.det-x{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ov{overflow-y:auto;-webkit-overflow-scrolling:touch;align-items:flex-start;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal{margin:auto}
@media(max-width:768px){.fgi input,.fgi select,.fgi textarea,.search-input{font-size:16px!important}}
@media(max-width:480px){.modal{padding:20px 16px;border-radius:18px}.fa{flex-direction:column-reverse}.btn-cancel,.btn-submit{width:100%}}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="egypt.js"></script>
<script src="site.js"></script>
<script src="assistant.js" defer></script>
<link rel="manifest" href="manifest-listings.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">إ</div>
      <div class="logo-name">إيجاري</div>
    </a>
    <div class="header-links">
      <a class="btn-login" href="iigari.html">🔐 <span>دخول المالك</span></a>
    </div>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="search-bar-wrap">
    <input class="search-input" id="search" placeholder="🔍 ابحث بالاسم أو المنطقة..." oninput="applyFilters()">
  </div>
</div>

<!-- FILTERS (chips + bottom sheet) -->
<div class="chips" id="chips">
  <button class="chip" id="ch-place" onclick="openSheet('place')">📍 المكان</button>
  <button class="chip" id="ch-price" onclick="openSheet('price')">💰 السعر</button>
  <button class="chip" id="ch-type" onclick="openSheet('type')">🏠 النوع</button>
  <button class="chip" id="btn-near" onclick="nearMe()">📍 القريب مني</button>
  <button class="chip" id="btn-map" onclick="toggleMap()">🗺️ الخريطة</button>
  <button class="chip chip-clear" id="ch-clear" onclick="clearFilters()" style="display:none">✕ مسح الفلاتر</button>
</div>
<div class="rline"><div class="results-count" id="results-count" style="margin:0"></div><select class="fsel" id="f-rad" onchange="applyFilters()" style="display:none"><option value="">أي مسافة</option><option value="5">5 كم</option><option value="10">10 كم</option><option value="25">25 كم</option><option value="50">50 كم</option></select></div>
<div class="sheet" id="fsheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-card">
    <div class="sheet-h"><b id="sh-title"></b><button onclick="closeSheet()">✕</button></div>
    <div class="sec" id="sec-place"><label>المحافظة</label><select class="fsel" id="f-gov" onchange="geoChg('gov')"></select><label>المدينة / المنطقة</label><select class="fsel" id="f-city" onchange="geoChg('city')"></select><label>الحي</label><select class="fsel" id="f-dist" onchange="applyFilters()"></select></div>
    <div class="sec" id="sec-price"><label>السعر الشهري</label><select class="fsel" id="f-price" onchange="applyFilters()">
      <option value="">كل الأسعار</option>
      <option value="0-2000">أقل من 2,000 ج</option>
      <option value="2000-5000">2,000 — 5,000 ج</option>
      <option value="5000-10000">5,000 — 10,000 ج</option>
      <option value="10000-99999">أكثر من 10,000 ج</option>
    </select></div>
    <div class="sec" id="sec-type"><label>نوع العقار</label><select class="fsel" id="f-type" onchange="applyFilters()">
      <option value="">كل الأنواع</option>
      <option value="apartment">🏢 عمارة</option>
      <option value="house">🏠 بيت</option>
      <option value="flat">🛏️ شقة</option>
      <option value="villa">🏡 فيلا</option>
      <option value="shop">🏪 محل</option>
      <option value="office">🏦 مكتب</option>
      <option value="other">📦 أخرى</option>
    </select></div>
    <div class="sheet-f"><button class="b-clear" onclick="clearSec()">مسح</button><button class="b-apply" onclick="closeSheet()">عرض النتائج</button></div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="map-wrap" style="display:none;height:340px;border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid #e2e8f0"><div id="lmap" style="height:100%"></div></div>
  <div id="listings-container"><div class="ld"><div class="sp"></div> جاري تحميل العقارات...</div></div>
</div>

<div class="det" id="ov-detail" onclick="if(event.target===this)closeDetail()"><div class="det-card"><button class="det-x" onclick="closeDetail()">✕</button><div id="det-body"></div></div></div>

<!-- AUTH MODAL -->
<div class="ov" id="ov-auth">
  <div class="modal">
    <div class="modal-ttl" id="au-title">🔐 سجّل دخولك أولاً</div>
    <div class="modal-sub">لازم يكون عندك حساب عشان تتواصل مع صاحب العقار ويتسجل طلبك</div>
    <div class="fgi" id="au-phone-w" style="display:none"><label>رقم الموبايل (واتساب) *</label><input id="au-phone" type="tel" dir="ltr" placeholder="01XXXXXXXXX"></div>
    <div class="fgi" id="au-name-w" style="display:none"><label>الاسم الكامل *</label><input id="au-name" placeholder="محمد أحمد علي"></div>
    <div class="fgi"><label>البريد الإلكتروني *</label><input id="au-email" type="email" placeholder="name@example.com"></div>
    <div class="fgi"><label>كلمة المرور * (8 أحرف+)</label><input id="au-pass" type="password"></div>
    <div class="fa">
      <button class="btn-cancel" id="au-toggle" onclick="toggleAuth()">ليس لدي حساب — إنشاء حساب</button>
      <button class="btn-submit" id="au-go" onclick="doAuth()">دخول</button>
    </div>
  </div>
</div>

<!-- REQUEST MODAL -->
<div class="ov" id="ov-request">
  <div class="modal">
    <div id="modal-content">
      <div class="modal-ttl">📋 طلب إيجار</div>
      <div class="modal-sub">أدخل بياناتك وهنتواصل معاك في أقرب وقت</div>
      <div class="modal-prop" id="modal-prop-info"></div>
      <div class="fgi"><label>الاسم الكامل *</label><input id="req-name" placeholder="محمد أحمد علي" autocomplete="name" maxlength="100"></div>
      <div class="fgi"><label>رقم الهاتف / واتساب *</label><input id="req-phone" placeholder="01012345678" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20"></div>
      <div class="fgi"><label>ملاحظات أو أسئلة</label><textarea id="req-notes" maxlength="1000" placeholder="مثال: عايز أعرف أكتر عن العقار، متى ممكن أعمل معاينة..."></textarea></div>
      <div class="fa">
        <button class="btn-cancel" onclick="closeOv('ov-request')">إلغاء</button>
        <button class="btn-submit" onclick="submitRequest()">إرسال الطلب 📨</button>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-logo">● إيجاري</div>
  <div class="footer-sub">منصة إدارة العقارات والإيجارات</div>
  <div><a class="footer-link" href="iigari.html">دخول المالك ←</a></div>
</div>

<div class="toast" id="toast"></div>

<script>

const dbPub=createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

let ALL_LISTINGS=[];
let currentUnitId=null;

const typeMap={apartment:'🏢 عمارة',house:'🏠 بيت',flat:'🛏️ شقة',villa:'🏡 فيلا',shop:'🏪 محل',land:'🌿 أرض',office:'🏦 مكتب',warehouse:'🏭 مخزن',commercial:'🏬 مبنى تجاري',other:'📦 أخرى'};
const typeEmoji={apartment:'🏢',house:'🏠',flat:'🛏️',villa:'🏡',shop:'🏪',land:'🌿',office:'🏦',warehouse:'🏭',commercial:'🏬',other:'📦'};

window.addEventListener('load', async()=>{
  loadSite(dbPub);
  ownerBtn();

async function loadListings(){
  // جلب الوحدات الفارغة أو المدرجة للإيجار
  const{data:units,error}=await dbPub.from('units')
    .select('id,unit_number,floor,area_sqm,rent_price,listing_price,listing_notes,created_at,properties(name,address,type,notes,governorate,city,district,lat,lng,images)')
    .eq('status','vacant')
    .eq('is_listed',true)
    .order('created_at',{ascending:false});

  if(error){
    document.getElementById('listings-container').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">حدث خطأ</div><div class="empty-sub">تعذر تحميل العقارات</div></div>';
    return;
  }

  // فلتر الوحدات اللي عندها property
  ALL_LISTINGS=(units||[]).filter(u=>u.properties);
  renderListings(ALL_LISTINGS);
}


// ── LOCATION / MAP ──
let NEAR=null, LMAP=null, LLAYER=null, LAST=[];
const escL=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fillOpt(id,list,ph){document.getElementById(id).innerHTML=`<option value="">${ph}</option>`+list.map(x=>`<option>${x}</option>`).join('');}
window.addEventListener('DOMContentLoaded',()=>{fillOpt('f-gov',Object.keys(EG),'كل المحافظات');fillOpt('f-city',[],'كل المدن');fillOpt('f-dist',[],'كل الأحياء');});
function geoChg(k){
  const g=document.getElementById('f-gov').value;
  if(k==='gov'){fillOpt('f-city',EG[g]?Object.keys(EG[g]):[],'كل المدن');fillOpt('f-dist',[],'كل الأحياء');}
  else{const c=document.getElementById('f-city').value;fillOpt('f-dist',(EG[g]&&EG[g][c])||[],'كل الأحياء');}
  applyFilters();
}
function dist(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nearMe(){
  const btn=document.getElementById('btn-near'),rad=document.getElementById('f-rad');
  if(NEAR){NEAR=null;btn.textContent='📍 القريب مني';rad.style.display='none';rad.value='';applyFilters();return;}
  if(!navigator.geolocation){toast('المتصفح لا يدعم تحديد الموقع',true);return;}
  navigator.geolocation.getCurrentPosition(p=>{NEAR={lat:p.coords.latitude,lng:p.coords.longitude};btn.textContent='✅ القريب مني';rad.style.display='inline-block';applyFilters();},()=>toast('اسمح للمتصفح بتحديد موقعك',true),{enableHighAccuracy:true});
}
function locLine(u){
  const p=u.properties,t=[p.governorate,p.city,p.district].filter(Boolean).join(' — ');
  const d=u._d!=null?` · <b>${u._d<1?Math.round(u._d*1000)+' م':u._d.toFixed(1)+' كم'}</b>`:'';
  const nav=p.lat!=null?` · <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener">🧭 الاتجاهات</a>`:'';
  return(t||d||nav)?`<div style="font-size:12px;color:#718096;margin:2px 0 8px">${escL(t)}${d}${nav}</div>`:'';
}
function toggleMap(){
  const w=document.getElementById('map-wrap'),show=w.style.display==='none';
  w.style.display=show?'block':'none';
  document.getElementById('btn-map').textContent=show?'📋 القائمة فقط':'🗺️ الخريطة';
  if(!show) return;
  if(!LMAP){LMAP=L.map('lmap').setView([27,30.5],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LMAP);LLAYER=L.layerGroup().addTo(LMAP);}
  setTimeout(()=>{LMAP.invalidateSize();drawMap();},100);
}
function drawMap(){
  if(!LLAYER||!LMAP) return;
  LLAYER.clearLayers();const pts=[];
  LAST.forEach(u=>{const p=u.properties;if(p.lat==null||p.lng==null)return;const price=u.listing_price||u.rent_price;
    L.marker([p.lat,p.lng]).addTo(LLAYER).bindPopup(`<b>${escL(p.name)}</b><br>وحدة ${escL(u.unit_number)}${price?'<br>'+Number(price).toLocaleString('ar-EG')+' ج / شهريًا':''}`);pts.push([p.lat,p.lng]);});
  if(NEAR){L.circleMarker([NEAR.lat,NEAR.lng],{radius:8,color:'#2563eb'}).addTo(LLAYER).bindPopup('موقعك');pts.push([NEAR.lat,NEAR.lng]);}
  if(pts.length)LMAP.fitBounds(pts,{padding:[30,30],maxZoom:15});
}

// ── CHIPS / SHEET ──
let SHEET='';
function openSheet(k){
  SHEET=k;
  document.getElementById('sh-title').textContent={place:'📍 المكان',price:'💰 السعر',type:'🏠 نوع العقار'}[k];
  document.querySelectorAll('.sec').forEach(e=>e.classList.toggle('on',e.id==='sec-'+k));
  document.getElementById('fsheet').classList.add('open');
}
function closeSheet(){document.getElementById('fsheet').classList.remove('open');}
function clearSec(){
  if(SHEET==='place'){document.getElementById('f-gov').value='';geoChg('gov');}
  else{document.getElementById(SHEET==='price'?'f-price':'f-type').value='';applyFilters();}
}
function clearFilters(){['f-gov','f-price','f-type','search'].forEach(id=>document.getElementById(id).value='');geoChg('gov');}
function setChip(id,t,on){const e=document.getElementById(id);e.textContent=t;e.classList.toggle('on',on);}
function updateChips(){
  const g=document.getElementById('f-gov').value,c=document.getElementById('f-city').value,d=document.getElementById('f-dist').value;
  const pl=d||c||g; setChip('ch-place',pl?'📍 '+pl:'📍 المكان',!!pl);
  const pr=document.getElementById('f-price'); setChip('ch-price',pr.value?'💰 '+pr.options[pr.selectedIndex].text:'💰 السعر',!!pr.value);
  const ty=document.getElementById('f-type'); setChip('ch-type',ty.value?ty.options[ty.selectedIndex].text:'🏠 النوع',!!ty.value);
  document.getElementById('btn-near').classList.toggle('on',!!NEAR);
  const any=pl||pr.value||ty.value||document.getElementById('search').value;
  document.getElementById('ch-clear').style.display=any?'inline-block':'none';
}
async function ownerBtn(){
  const{data:{session}}=await db.auth.getSession(); if(!session) return;
  const cust=(session.user.user_metadata||{}).role==='customer';
  window.__loggedIn=true;window.__role=cust?'tenant':'owner';
  document.querySelectorAll('a[href="iigari.html"]').forEach(a=>{
    const inHeader=!!a.closest('.header');
    if(cust){a.removeAttribute('href');a.style.cursor='pointer';a.onclick=async e=>{e.preventDefault();if(confirm('تسجيل الخروج من حسابك؟')){await db.auth.signOut();location.reload();}};a.innerHTML=inHeader?'👤 <span>خروج</span>':'تسجيل الخروج';}
    else a.innerHTML=inHeader?'🏢 <span>لوحة العقارات</span>':'لوحة إدارة عقاراتي ←';
  });
}

async function shareUnit(id,name){
  const url=location.origin+'/api/share?u='+id;
  const data={title:name||'عقار للإيجار',text:'شوف العقار ده على '+((window.SITE&&SITE.site_name)||'إيجاري'),url};
  if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(url);toast('تم نسخ الرابط ✅');}catch(e){prompt('انسخ الرابط:',url);}
}
function focusFromUrl(){
  const id=new URLSearchParams(location.search).get('u'); if(!id) return;
  const el=document.getElementById('u-'+id);
  if(!el){toast('هذا العقار لم يعد متاحًا',true);return;}
  el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),4000);openDetail(id);
}
function applyFilters(){
  const search=document.getElementById('search').value.toLowerCase();
  const fType=document.getElementById('f-type').value;
  const fPrice=document.getElementById('f-price').value;
  const fG=document.getElementById('f-gov').value,fC=document.getElementById('f-city').value,fD=document.getElementById('f-dist').value,fR=+document.getElementById('f-rad').value||0;

  let filtered=ALL_LISTINGS.filter(u=>{
    const prop=u.properties;
    const matchSearch=!search||
      prop.name?.toLowerCase().includes(search)||
      prop.address?.toLowerCase().includes(search)||
      prop.type?.toLowerCase().includes(search)||[prop.governorate,prop.city,prop.district].some(x=>x&&x.toLowerCase().includes(search));
    const matchType=!fType||prop.type===fType;
    let matchPrice=true;
    if(fPrice&&u.rent_price){
      const [min,max]=fPrice.split('-').map(Number);
      matchPrice=u.rent_price>=min&&u.rent_price<=max;
    }
    u._d=(NEAR&&prop.lat!=null&&prop.lng!=null)?dist(NEAR.lat,NEAR.lng,prop.lat,prop.lng):null;
    const matchGeo=(!fG||prop.governorate===fG)&&(!fC||prop.city===fC)&&(!fD||prop.district===fD)&&(!(NEAR&&fR)||(u._d!=null&&u._d<=fR));
    return matchSearch&&matchType&&matchPrice&&matchGeo;
  });
  if(NEAR) filtered.sort((a,b)=>(a._d??1e9)-(b._d??1e9));
  renderListings(filtered);
  updateChips();
}

function renderListings(listings){
  LAST=listings;
  if(document.getElementById('map-wrap').style.display!=='none') drawMap();
  const container=document.getElementById('listings-container');
  const count=document.getElementById('results-count');
  count.textContent=`${listings.length} عقار متاح`;

  if(!listings.length){
    container.innerHTML=`<div class="empty">
      <div class="empty-icon">🏠</div>
      <div class="empty-title">لا توجد عقارات متاحة حالياً</div>
      <div class="empty-sub">جرب تغيير الفلتر أو تعال لاحقاً</div>
    </div>`;
    return;
  }

  container.innerHTML=`<div class="mk-grid">${listings.map(u=>{
    const p=u.properties||{},emoji=typeEmoji[p.type]||'🏠',price=u.listing_price||u.rent_price;
    const img=p.images&&p.images[0];
    const d=u._d!=null?(u._d<1?Math.round(u._d*1000)+' م':u._d.toFixed(1)+' كم'):'';
    const loc=[p.city,p.district].filter(Boolean).join(' — ')||p.governorate||'';
    return`<div class="mk-card" id="u-${u.id}" onclick="openDetail('${u.id}')">
      <div class="mk-img">${img?`<img src="${escL(img)}" loading="lazy" alt="">`:`<div class="mk-ph"><img src="icon-192.png" alt=""><span>${emoji}</span></div>`}
        <span class="mk-badge">${d?'📍 '+d:(typeMap[p.type]||'عقار')}</span>
        ${p.images&&p.images.length>1?`<span class="mk-count">📷 ${p.images.length}</span>`:''}
      </div>
      <div class="mk-body"><div class="mk-price">${price?Number(price).toLocaleString('ar-EG')+' ج':'اتصل للسعر'}${price?'<small>/ شهريًا</small>':''}</div><div class="mk-title">${escL(p.name||'عقار متاح')}</div><div class="mk-loc">${escL(loc||p.address||'')}</div></div>
    </div>`;
  }).join('')}</div>`;
}

function reqFromUnit(id){const u=LAST.find(x=>x.id===id);if(!u)return;const p=u.properties||{};openRequest(u.id,p.name||'',typeEmoji[p.type]||'🏠',p.address||'');}
function shareFromUnit(id){const u=LAST.find(x=>x.id===id);if(u)shareUnit(id,(u.properties||{}).name||'');}
function openDetail(id){
  const u=LAST.find(x=>x.id===id); if(!u) return;
  const p=u.properties||{},emoji=typeEmoji[p.type]||'🏠',price=u.listing_price||u.rent_price,imgs=p.images||[];
  const chips=[u.area_sqm?'📐 '+u.area_sqm+' م²':'',u.floor?'🏢 الطابق '+u.floor:'',u.unit_number?'🔑 وحدة '+u.unit_number:'',typeMap[p.type]?emoji+' '+typeMap[p.type]:''].filter(Boolean).map(c=>`<span class="det-chip">${escL(c)}</span>`).join('');
  const notes=u.listing_notes||p.notes;
  document.getElementById('det-body').innerHTML=`
    <div class="det-gal">${imgs.length?imgs.map(src=>`<img src="${escL(src)}" alt="">`).join(''):`<div class="mk-ph" style="flex:0 0 100%;aspect-ratio:1/1"><img src="icon-192.png" alt=""><span style="font-size:72px">${emoji}</span></div>`}</div>
    <div style="padding:16px 16px 22px">
      <div class="mk-price" style="font-size:24px">${price?Number(price).toLocaleString('ar-EG')+' ج':'اتصل للسعر'}${price?'<small>/ شهريًا</small>':''}</div>
      <div class="det-title">${escL(p.name||'عقار متاح')}</div>
      <div style="font-size:13px;color:#718096;margin-top:2px">📍 ${escL(p.address||'العنوان غير محدد')}</div>
      ${locLine(u)}
      <div class="det-chips">${chips}</div>
      ${notes?`<div class="det-notes">${escL(notes)}</div>`:''}
      <div class="card-footer" style="margin-top:16px"><button class="btn-request" onclick="closeDetail();reqFromUnit('${u.id}')">📋 سجل طلبك</button><button class="btn-share" onclick="shareFromUnit('${u.id}')">🔗 مشاركة</button></div>
    </div>`;
  document.getElementById('ov-detail').classList.add('open');
}
function closeDetail(){document.getElementById('ov-detail').classList.remove('open');}

const REQ_FORM=document.getElementById('modal-content').innerHTML;
function showRequest(unitId, propName, emoji, addr, uname, uphone){
  document.getElementById('modal-content').innerHTML=REQ_FORM;
  currentUnitId=unitId;
  document.getElementById('modal-prop-info').innerHTML=`
    <div class="modal-prop-icon">${emoji}</div>
    <div><div class="modal-prop-name">${escL(propName)}</div><div class="modal-prop-addr">📍 ${escL(addr||'العنوان غير محدد')}</div></div>`;
  document.getElementById('modal-content').querySelector('.modal-ttl').textContent='📋 طلب إيجار';
  document.getElementById('req-name').value=uname||'';
  document.getElementById('req-phone').value=uphone||'';
  document.getElementById('req-notes').value='';
  document.getElementById('ov-request').classList.add('open');
}


let pendingReq=null, authMode='login';
async function myProf(uid){const{data}=await db.from('user_profiles').select('phone,full_name').eq('id',uid).maybeSingle();return data||{};}
async function openRequest(unitId, propName, emoji, addr){
  pendingReq=[unitId, propName, emoji, addr];
  const{data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('ov-auth').classList.add('open');return;}
  const m=session.user.user_metadata||{},pf=await myProf(session.user.id);
  showRequest(unitId, propName, emoji, addr, pf.full_name||m.full_name||m.name||'', pf.phone||m.phone||'');
}
function toggleAuth(){
  authMode=authMode==='login'?'signup':'login';
  const su=authMode==='signup';
  document.getElementById('au-name-w').style.display=su?'block':'none';
  document.getElementById('au-phone-w').style.display=su?'block':'none';
  document.getElementById('au-toggle').textContent=su?'لدي حساب — تسجيل الدخول':'ليس لدي حساب — إنشاء حساب';
  document.getElementById('au-go').textContent=su?'إنشاء حساب':'دخول';
  document.getElementById('au-title').textContent=su?'📝 إنشاء حساب':'🔐 سجّل دخولك أولاً';
}
async function doAuth(){
  const email=document.getElementById('au-email').value.trim();
  const pass=document.getElementById('au-pass').value;
  const name=document.getElementById('au-name').value.trim();
  if(!email||pass.length<8){toast('أدخل البريد وكلمة مرور 8 أحرف على الأقل',true);return;}
  let r;
  if(authMode==='signup'){
    const phone=document.getElementById('au-phone').value.trim();
    if(!name){toast('أدخل الاسم الكامل',true);return;}
    if(phone.replace(/\D/g,'').length<10){toast('أدخل رقم موبايل صحيح',true);return;}
    r=await db.auth.signUp({email,password:pass,options:{data:{full_name:name,phone,account_type:'tenant',role:'customer'}}});
    if(!r.error&&!r.data.session){toast('تم إرسال رابط تأكيد على بريدك. أكّده ثم سجّل دخولك');return;}
  } else {
    r=await db.auth.signInWithPassword({email,password:pass});
  }
  if(r.error){toast(r.error.message==='Invalid login credentials'?'بيانات غير صحيحة':r.error.message,true);return;}
  closeOv('ov-auth');
  if(pendingReq){const u=r.data.user.user_metadata||{},pf=await myProf(r.data.user.id);showRequest(...pendingReq, pf.full_name||u.full_name||u.name||name||'', pf.phone||u.phone||'');}
}
function closeOv(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

window.ASSIST_DB=db;
window.assistantCtx=()=>({page:'gallery',loggedIn:!!window.__loggedIn,role:window.__role||'visitor'});
let SENDING=false;
async function submitRequest(){
  if(SENDING) return;
  const name=document.getElementById('req-name').value.trim();
  const phone=document.getElementById('req-phone').value.trim();
  const notes=document.getElementById('req-notes').value.trim();
  const digits=phone.replace(/\D/g,'');
  if(name.length<2){toast('أدخل الاسم الكامل',true);return;}
  if(digits.length<10||digits.length>15){toast('أدخل رقم هاتف صحيح',true);return;}
  if(!currentUnitId){toast('حدث خطأ، أعد فتح العقار وحاول مرة أخرى',true);return;}
  const{data:{user}}=await db.auth.getUser();
  if(!user){closeOv('ov-request');document.getElementById('ov-auth').classList.add('open');return;}
  const btn=document.querySelector('#modal-content .btn-submit');
  SENDING=true;if(btn){btn.disabled=true;btn.textContent='جاري الإرسال...';}
  const{error}=await db.from('rental_requests').insert({unit_id:currentUnitId,name:name.slice(0,100),phone:phone.slice(0,30),notes:notes.slice(0,1000)||null,email:user.email,status:'new'});
  SENDING=false;
  if(error){
    if(btn){btn.disabled=false;btn.textContent='إرسال الطلب 📨';}
    toast(error.code==='23505'?'لقد أرسلت طلبًا لهذا العقار من قبل، وسيتم التواصل معك':/row-level|policy|violat/i.test(error.message)?'هذا العقار لم يعد متاحًا للطلبات':'تعذر إرسال الطلب، تأكد من الاتصال وحاول مرة أخرى',true);
    return;
  }
  document.getElementById('modal-content').innerHTML=`
    <div class="success-box">
      <div class="success-icon">🎉</div>
      <div class="success-title">تم إرسال طلبك!</div>
      <div class="success-sub">شكراً ${escL(name)}!<br>طلبك وصل لصاحب العقار وهيتواصل معاك على<br><strong dir="ltr">${escL(phone)}</strong><br>في أقرب وقت.</div>
      <button class="btn-submit" onclick="closeOv('ov-request')">حسناً ✓</button>
    </div>`;
}

function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.innerHTML=`${err?'❌':'✅'} ${msg}`;
  t.style.borderColor=err?'rgba(220,38,38,.3)':'rgba(22,163,74,.3)';
  t.style.color=err?'#dc2626':'#16a34a';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}
</script>
